[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  VITE_SITE_URL = "https://ezperformance.net"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Single-page app fallback so unknown paths still load the site.
# Real files (services.html, robots.txt, ...) are served first.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
