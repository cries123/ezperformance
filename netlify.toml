[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  VITE_SITE_URL = "https://ezperformance.net"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# No catch-all redirect: real pages are services.html, contact.html, etc.
# Anything else gets Netlify's automatic 404.html with a real 404 status.
